      <path d="M121 320c-9 0-16 5-20 12-3 5-8 9-14 12-5 2-5 7-2 10s8 2 12 0c-3 6-5 11-2 14 4 3 9-2 13-7l12-16 9-20Z" fill="url(#skin)" stroke="#a96858" stroke-width="2"/>
      <path d="M198 238c-15 7-30 15-44 27l18 25c15-12 31-19 48-24Z" fill="url(#uniform)" stroke="#a74e36" stroke-opacity=".6" stroke-width="2"/>

      <!-- Uniform details -->
      <path d="M260 282h34v42h-34z" fill="#15233a" stroke="#fff0c5" stroke-width="2"/>
      <text x="277" y="311" text-anchor="middle" fill="#ffe29a" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="24">KF</text>
      <path d="M197 337h137" stroke="#fff0c5" stroke-opacity=".48" stroke-width="3"/>
