  <path d="M47 373h418v47c-60 52-129 80-209 91-80-11-149-39-209-91Z" fill="#0a111e" stroke="url(#metal)" stroke-width="5"/>
  <path d="M67 386h378v25c-54 42-115 66-189 77-74-11-135-35-189-77Z" fill="#14253a"/>
  <text x="256" y="411" text-anchor="middle" fill="#ffe19a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" letter-spacing="3">SHART SHOOTER</text>
  <text x="256" y="443" text-anchor="middle" fill="#f3f6fb" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="8">KICKBALL  •  KF</text>
