      <path d="M226 137c5-3 11-3 15 0m35 0c5-3 11-3 16 0" fill="none" stroke="#35242a" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="234" cy="139" rx="3.3" ry="3.8" fill="#201c25"/>
      <ellipse cx="284" cy="139" rx="3.3" ry="3.8" fill="#201c25"/>
      <circle cx="235" cy="138" r="1" fill="#fff"/>
      <circle cx="285" cy="138" r="1" fill="#fff"/>
      <path d="M259 140c-3 9-7 17-5 20 2 2 6 3 10 1" fill="none" stroke="#bd7967" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M246 174c8 7 19 8 28 1" fill="none" stroke="#9e4e53" stroke-width="3" stroke-linecap="round"/>
      <path d="M233 182c8 12 20 18 34 17" fill="none" stroke="#fff0df" stroke-opacity=".42" stroke-width="3" stroke-linecap="round"/>

      <!-- Neck and athletic jersey -->
      <path d="M239 193v27c8 12 27 15 40 1l-1-31Z" fill="url(#skin)"/>
      <path d="M175 324c5-45 18-75 41-91 15-10 30-15 43-15 20 0 39 8 53 23 19 21 30 49 35 83l-20 40H188Z" fill="url(#uniform)" stroke="#a74e36" stroke-opacity=".62" stroke-width="3"/>
      <path d="M216 231c10 14 24 22 43 23 18 1 35-7 48-21l14 19c-17 19-38 28-63 27-25-1-46-12-58-31Z" fill="#fff0c5" opacity=".8"/>
      <path d="M260 255v84m-11-83 11 13 12-13" fill="none" stroke="#fff5d5" stroke-opacity=".72" stroke-width="4"/>
      <path d="M193 305c18 13 39 20 66 20 27 0 49-7 68-21" fill="none" stroke="#a94936" stroke-opacity=".42" stroke-width="3"/>

