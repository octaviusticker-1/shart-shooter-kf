      <path d="M322 59h92v18c0 32-19 57-46 67-27-10-46-35-46-67Z" fill="url(#metal)" stroke="#fff1b0" stroke-width="3"/>
      <path d="M322 72h-20c0 37 23 62 61 67m51-67h20c0 37-23 62-61 67" fill="none" stroke="#d99d32" stroke-width="12" stroke-linecap="round"/>
