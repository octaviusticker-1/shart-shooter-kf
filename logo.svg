      <path d="M355 119c-4-6-4-12-2-18m9 15c-3-6-2-12 1-18m8 16c-2-6 0-12 3-17" fill="none" stroke="#b87762" stroke-width="2" stroke-linecap="round"/>
      <path d="M296 231c-9 14-19 30-28 49l-25-17c8-20 20-40 37-56Z" fill="url(#uniform)" stroke="#a74e36" stroke-opacity=".6" stroke-width="2"/>

