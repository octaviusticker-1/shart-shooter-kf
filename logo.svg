<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Shart Shooter KF champions</title>
  <desc id="description">A polished sports crest showing a kickball player raising a championship trophy.</desc>
  <defs>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#203b5a"/>
      <stop offset=".52" stop-color="#111c30"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff5c3"/>
      <stop offset=".22" stop-color="#ffe17b"/>
      <stop offset=".48" stop-color="#d99520"/>
      <stop offset=".68" stop-color="#ffdc67"/>
      <stop offset="1" stop-color="#9d5d15"/>
    </linearGradient>
    <linearGradient id="skin" x1=".15" y1="0" x2=".86" y2="1">
      <stop stop-color="#ffe0c3"/>
      <stop offset=".4" stop-color="#eeb895"/>
      <stop offset=".78" stop-color="#d78e70"/>
      <stop offset="1" stop-color="#ae6656"/>
    </linearGradient>
    <linearGradient id="uniform" x1=".1" y1="0" x2=".9" y2="1">
      <stop stop-color="#ffe099"/>
      <stop offset=".4" stop-color="#f8ae43"/>
      <stop offset="1" stop-color="#cc5a35"/>
    </linearGradient>
    <linearGradient id="hair" x1=".1" y1="0" x2=".9" y2="1">
      <stop stop-color="#69414c"/>
      <stop offset=".35" stop-color="#372637"/>
      <stop offset="1" stop-color="#171523"/>
    </linearGradient>
    <radialGradient id="light" cx=".28" cy=".12" r=".92">
      <stop stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="depth" x="-.25" y="-.2" width="1.5" height="1.55">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020611" flood-opacity=".5"/>
    </filter>
    <clipPath id="inside">
      <circle cx="256" cy="248" r="205"/>
    </clipPath>
  </defs>

  <path d="M256 9 475 91v155c0 121-87 208-219 257C124 454 37 367 37 246V91Z" fill="#070b13" stroke="url(#metal)" stroke-width="8"/>
  <path d="M256 25 459 101v145c0 110-77 192-203 241C130 438 53 356 53 246V101Z" fill="url(#crest)" stroke="#f8d77d" stroke-opacity=".48" stroke-width="2"/>

  <g clip-path="url(#inside)">
    <path d="M38 361c75-51 138-68 218-68s144 17 219 68v170H38Z" fill="#0b1423"/>
    <path d="M63 139c52-76 116-113 193-113s141 37 193 113" fill="none" stroke="#fff4cf" stroke-opacity=".08" stroke-width="3"/>
    <circle cx="256" cy="247" r="204" fill="url(#light)"/>

