      <path d="M293 229c17-17 31-38 40-60l17-42c4-10 12-14 20-11 8 4 9 12 5 21l-18 43c-10 24-21 45-37 63l-27-14Z" fill="url(#skin)" stroke="#a96858" stroke-opacity=".55" stroke-width="2"/>
